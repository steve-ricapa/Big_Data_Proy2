name: Local-code quality
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra mcp --python 3.11
      - run: uv run --extra dev --extra mcp pytest -q
      - run: uv run --extra dev --extra mcp ruff check src services tests airflow/dags scripts
      - run: python -m compileall -q src services airflow/dags
      # Actual-engine tests are local explicit commands; this job needs no cloud credentials.
