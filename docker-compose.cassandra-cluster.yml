# Optional cloud overlay; use after the verified Cassandra backup only.
x-cassandra-client: &cassandra-client
  CASSANDRA_CONTACT_POINTS: ${TI_CASSANDRA_CONTACT_POINTS:?configure all Cassandra contact points}
  CASSANDRA_LOCAL_DATACENTER: dc1
  CASSANDRA_CONSISTENCY: ${TI_CASSANDRA_CONSISTENCY:-LOCAL_QUORUM}

services:
  cassandra:
    network_mode: host
    networks: !reset []
    restart: unless-stopped
    environment:
      CASSANDRA_LISTEN_ADDRESS: ${TI_CASSANDRA_PRIMARY_IP:?configure the primary Cassandra private IP}
      CASSANDRA_BROADCAST_ADDRESS: ${TI_CASSANDRA_PRIMARY_IP}
      CASSANDRA_RPC_ADDRESS: ${TI_CASSANDRA_PRIMARY_IP}
      CASSANDRA_BROADCAST_RPC_ADDRESS: ${TI_CASSANDRA_PRIMARY_IP}
      CASSANDRA_SEEDS: ${TI_CASSANDRA_SEEDS:?configure primary and secondary seed IPs}
      CASSANDRA_NUM_TOKENS: "16"
    healthcheck:
      test: [CMD-SHELL, 'nodetool statusbinary | grep -qx running']
  runner:
    environment: *cassandra-client
    volumes: [./src:/app/src:ro]
  tester:
    networks: [data, edge]
    environment: *cassandra-client
    volumes: [./src:/app/src:ro]
  api:
    environment: *cassandra-client
    volumes: [./src:/app/src:ro]
  airflow3-api:
    environment: *cassandra-client
  airflow3-scheduler:
    environment: *cassandra-client
  airflow3-dag-processor:
    networks: [data, edge]
    environment: *cassandra-client
